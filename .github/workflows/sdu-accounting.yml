name: SDU Accounting Core

on:
  pull_request:
    branches: [main]
    paths:
      - "src/sdu_accounting_core.py"
      - "tests/test_sdu_accounting_core.py"
      - "docs/sdu/**"
      - ".github/workflows/sdu-accounting.yml"
  push:
    branches:
      - "feat/sdu-accounting-core-v2"
    paths:
      - "src/sdu_accounting_core.py"
      - "tests/test_sdu_accounting_core.py"
      - "docs/sdu/**"
      - ".github/workflows/sdu-accounting.yml"

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install "pytest>=8,<9"

      - name: Run SDU Accounting Core tests
        run: python -m pytest -q tests/test_sdu_accounting_core.py

      - name: Compile SDU Accounting Core
        run: python -m py_compile src/sdu_accounting_core.py
