name: SDU Accounting Core

on:
  pull_request:
    branches: [main]
    paths:
      - "src/sdu_*.py"
      - "tests/test_sdu_*.py"
      - "migrations/001_sdu_ledger.sql"
      - "docs/sdu/**"
      - ".github/workflows/sdu-accounting.yml"
  push:
    branches:
      - "feat/sdu-accounting-core-v2"
    paths:
      - "src/sdu_*.py"
      - "tests/test_sdu_*.py"
      - "migrations/001_sdu_ledger.sql"
      - "docs/sdu/**"
      - ".github/workflows/sdu-accounting.yml"

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sdu_test
          POSTGRES_USER: sdu_test
          POSTGRES_PASSWORD: sdu_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sdu_test -d sdu_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SDU_TEST_DATABASE_URL: postgresql://sdu_test:sdu_test_password@localhost:5432/sdu_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install "pytest>=8,<9" "psycopg[binary]>=3.2,<4"

      - name: Run SDU authorization, checkpoint and ledger tests
        run: >-
          python -m pytest -q
          tests/test_sdu_accounting_core.py
          tests/test_sdu_issuance_authorization.py
          tests/test_sdu_burn_authorization.py
          tests/test_sdu_external_deposits.py
          tests/test_sdu_ledger_checkpoints.py
          tests/test_sdu_postgres_ledger.py

      - name: Compile SDU modules
        run: python -m compileall -q src/sdu_*.py

      - name: Validate SQL migration file exists
        run: test -s migrations/001_sdu_ledger.sql
