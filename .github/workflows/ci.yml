name: EIIOM CI

on:
  push:
    branches: [main, eiiom-masterplan-2045, eiiom-v4-federation-megasystem]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run invariant and schema tests
        run: python -m pytest -q

      - name: Audit federation authority boundaries
        run: python src/federation_audit.py --config config/federation_v4.json

      - name: Solve BASE-v2 scenario
        run: python src/eiiom_optimizer.py --config config/base_scenario.json --output outputs/base

      - name: Print BASE summary
        run: cat outputs/base/summary.json

      - name: Run seven-sector SYNERGY Economy reference model
        run: python src/synergy_economy_7sector.py --output outputs/synergy_economy_7sector_v1.json

      - name: Print seven-sector economy summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("outputs/synergy_economy_7sector_v1.json").read_text(encoding="utf-8"))
          print(json.dumps({
              "model_id": p["model_id"],
              "whole_system_residual_usd": p["accounting"]["total_net_after_replacement_usd"],
          "repair_target_residual_usd": p["reproduction_repair"]["target_residual_after_replacement_usd"],
          "repair_target_replacement_coverage": p["reproduction_repair"]["target_replacement_coverage"],
          "repair_public_residual_usd": p["reproduction_repair"]["public_target_residual_usd"],
          "repair_private_residual_usd": p["reproduction_repair"]["private_target_residual_usd"],
              "public_portfolio_residual_usd": p["accounting"]["public_net_after_replacement_usd"],
              "basket_cost_reduction_pct": 100 * p["productivity"]["net_basket_cost_reduction_share"],
              "labor_release_pct": 100 * p["productivity"]["net_labor_hours_released_share"],
              "capital_30y_with_crises_usd": p["portfolio_30y_target_with_crises"]["final_productive_capital_usd"]
          }, indent=2))
          PY
