name: EIIOM CI

on:
  push:
    branches: [main, eiiom-masterplan-2045, eiiom-v4-federation-megasystem]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run SLE focused tests
        run: python -m pytest -q tests/test_synergy_labor_economy.py tests/test_synergy_labor_credit_ledger.py

      - name: Run invariant and schema tests
        run: python -m pytest -q

      - name: Audit federation authority boundaries
        run: python src/federation_audit.py --config config/federation_v4.json

      - name: Solve BASE-v2 scenario
        run: python src/eiiom_optimizer.py --config config/base_scenario.json --output outputs/base

      - name: Print BASE summary
        run: cat outputs/base/summary.json

      - name: Run seven-sector SYNERGY Economy reference model
        run: python src/synergy_economy_7sector.py --output outputs/synergy_economy_7sector_v1.json

      - name: Run dynamic productivity flywheel and Monte Carlo stress models
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, "src")
          from synergy_productivity_flywheel_dynamic_v2 import build_report as build_dynamic
          from synergy_productivity_flywheel_dynamic_v2 import load_config as load_dynamic
          from synergy_productivity_flywheel_monte_carlo_v3 import build_report as build_mc
          from synergy_productivity_flywheel_monte_carlo_v3 import load_config as load_mc
          dynamic = build_dynamic(load_dynamic())
          mc = build_mc(load_mc())
          Path("outputs").mkdir(exist_ok=True)
          Path("outputs/synergy_productivity_flywheel_dynamic_v2.json").write_text(json.dumps(dynamic, indent=2), encoding="utf-8")
          Path("outputs/synergy_productivity_flywheel_monte_carlo_v3.json").write_text(json.dumps(mc, indent=2), encoding="utf-8")
          print("DYNAMIC V2")
          print(json.dumps([{
              "name": x["name"],
              "year_10_residual_usd": x["year_10_residual_usd"],
              "final_reserve_usd": x["final_reserve_usd"],
              "cumulative_unfunded_gap_usd": x["cumulative_unfunded_gap_usd"]
          } for x in dynamic["macro_scenarios"]], indent=2))
          print("MONTE CARLO V3")
          print(json.dumps([{
              "shock_probability_per_year": x["shock_probability_per_year"],
              "reserve_exhaustion_probability": x["reserve_exhaustion_probability"],
              "reserve_end_usd_quantiles": x["reserve_end_usd_quantiles"],
              "cumulative_unfunded_gap_usd_quantiles": x["cumulative_unfunded_gap_usd_quantiles"]
          } for x in mc["shock_sensitivity"]], indent=2))
          PY
      - name: Print seven-sector economy summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("outputs/synergy_economy_7sector_v1.json").read_text(encoding="utf-8"))
          print(json.dumps({
              "model_id": p["model_id"],
              "whole_system_residual_usd": p["accounting"]["total_net_after_replacement_usd"],
          "repair_target_residual_usd": p["reproduction_repair"]["target_residual_after_replacement_usd"],
          "repair_target_replacement_coverage": p["reproduction_repair"]["target_replacement_coverage"],
          "repair_public_residual_usd": p["reproduction_repair"]["public_target_residual_usd"],
          "repair_private_residual_usd": p["reproduction_repair"]["private_target_residual_usd"],
              "public_portfolio_residual_usd": p["accounting"]["public_net_after_replacement_usd"],
              "basket_cost_reduction_pct": 100 * p["productivity"]["net_basket_cost_reduction_share"],
              "labor_release_pct": 100 * p["productivity"]["net_labor_hours_released_share"],
              "capital_30y_with_crises_usd": p["portfolio_30y_target_with_crises"]["final_productive_capital_usd"]
          }, indent=2))
          PY

      - name: Run SYNERGY sector capital optimizer V4
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, "src")
          from synergy_sector_optimizer_v4 import build_report, load_config
          report = build_report(load_config())
          Path("outputs").mkdir(exist_ok=True)
          Path("outputs/synergy_sector_optimizer_v4.json").write_text(
              json.dumps(report, indent=2), encoding="utf-8"
          )
          print(json.dumps([{
              "budget_usd": case["budget_usd"],
              "invested_usd": case["invested_usd"],
              "direct_annual_net_residual_usd": case["portfolio_metrics"]["direct_annual_net_residual_usd"],
              "network_spillover_annual_net_residual_usd": case["portfolio_metrics"]["network_spillover_annual_net_residual_usd"],
              "sector_investment_usd": case["sector_investment_usd"],
          } for case in report["budget_sensitivity"]], indent=2))
          PY
