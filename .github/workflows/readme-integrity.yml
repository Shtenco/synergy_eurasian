name: README integrity
on:
  push:
    paths:
      - 'README.md'
      - 'assets/readme/**'
      - 'scripts/check_readme_media.py'
      - '.github/workflows/readme-integrity.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'assets/readme/**'
      - 'scripts/check_readme_media.py'
jobs:
  validate-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/check_readme_media.py