OM-v4</text><text x="959" y="218" fill="#b2c4df" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="450" text-anchor="start" opacity="1">Пространственный MILP и стресс-тесты</text><circle cx="1350" cy="275" r="14" fill="#7f87ff" opacity="1"/><line x1="1366" y1="275" x2="1526" y2="275" stroke="#27405f" stroke-width="5" opacity="1" /><rect x="1232" y="335" width="275" height="131" rx="18" fill="#101d34" stroke="#27405f" opacity="1"/><rect x="1232" y="335" width="5" height="131" rx="2" fill="#7f87ff" stroke="#7f87ff" opacity="1"/><text x="1253" y="366" fill="#7f87ff" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="start" opacity="1">ДО 2045</text><text x="1252" y="395" fill="#f1f6fd" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start" opacity="1">NETWORK</text><text x="1253" y="423" fill="#b2c4df" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="450" text-anchor="start" opacity="1">Проверяемое масштабирование</text><text x="747" y="560" fill="#b2c4df" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="450" text-anchor="middle" opacity="1">Каждый этап переходит дальше только после данных, тестов и независимых подтверждений.</text></svg>