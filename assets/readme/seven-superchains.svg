0 111 H1500" stroke="#20344f" opacity=".18"/><path d="M0 187 H1500" stroke="#20344f" opacity=".18"/><path d="M0 263 H1500" stroke="#20344f" opacity=".18"/><path d="M0 339 H1500" stroke="#20344f" opacity=".18"/><path d="M0 415 H1500" stroke="#20344f" opacity=".18"/><path d="M0 491 H1500" stroke="#20344f" opacity=".18"/><path d="M0 567 H1500" stroke="#20344f" opacity=".18"/><path d="M0 643 H1500" stroke="#20344f" opacity=".18"/><path d="M0 719 H1500" stroke="#20344f" opacity=".18"/><text x="52" y="56" fill="#f1f6fd" font-family="DejaVu Sans,Arial,sans-serif" font-size="36" font-weight="750" text-anchor="start" opacity="1">Семь взаимозависимых цепочек стоимости</text><text x="54" y="92" fill="#b2c4df" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="450" text-anchor="start" opacity="1">Слабое звено цепочки ограничивает производительность соседних отраслей</text><rect x="58" y="130" width="1380" height="73" rx="18" fill="#101d34" stroke="#27405f" opacity="1"/><rect x="58" y="130" width="82" height="73" rx="12" fill="#142640" stroke="#27405f" opacity="1"/><text x="100" y="177" fill="#52bdff" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="800" text-anchor="middle" opacity="1">01</text><text x="161" y="161" fill="#f1f6fd" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" opacity="1">ЭНЕРГЕТИКА</text><text x="161" y="188" fill="#b2c4df" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="450" text-anchor="start" opacity="1">Генерация  →  Сети  →  Электроника  →  Заводы / ЦОД</text><rect x="58" y="215" width="1380" height="73" rx="18" fill="#101d34" stroke="#27405f" opacity="1"/><rect x="58" y="215" width="82" height="73" rx="12" fill="#142640" stroke="#27405f" opacity="1"/><text x="100" y="262" fill="#37e5c0" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="800" text-anchor="middle" opacity="1">02</text><text x="161" y="246" fill="#f1f6fd" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" opacity="1">МАТЕРИАЛЫ</text><text x="161" y="273" fill="#b2c4df" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="450" text-anchor="start" opacity="1">Сырьё  →  Переработка  →  Станки  →  Робототехника</text><rect x="58" y="300" width="1380" height="73" rx="18" fill="#101d34" stroke="#27405f" opacity="1"/><rect x="58" y="300" width="82" height="73" rx="12" fill="#142640" stroke="#27405f" opacity="1"/><text x="100" y="347" fill="#7f87ff" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="800" text-anchor="middle" opacity="1">03</text><text x="161" y="331" fill="#f1f6fd" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" opacity="1">ВЫЧИСЛЕНИЯ</text><text x="161" y="358" fill="#b2c4df" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="450" text-anchor="start" opacity="1">Электричество  →  ЦОД  →  ИИ  →  Повышение производительности</text><rect x="58" y="385" width="1380" height="73" rx="18" fill="#101d34" stroke="#27405f" opacity="1"/><rect x="58" y="385" width="82" height="73" rx="12" fill="#142640" stroke="#27405f" opacity="1"/><text x="100" y="432" fill="#ffcc73" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="800" text-anchor="middle" opacity="1">04</text><text x="161" y="416" fill="#f1f6fd" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" opacity="1">ПРОДОВОЛЬСТВИЕ</text><text x="161" y="443" fill="#b2c4df" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="450" text-anchor="start" opacity="1">Генетика  →  Семена  →  Поля  →  Хранение  →  Переработка</text><rect x="58" y="470" width="1380" height="73" rx="18" fill="#101d34" stroke="#27405f" opacity="1"/><rect x="58" y="470" width="82" height="73" rx="12" fill="#142640" stroke="#27405f" opacity="1"/><text x="100" y="517" fill="#fd89c9" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="800" text-anchor="middle" opacity="1">05</text><text x="161" y="501" fill="#f1f6fd" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" opacity="1">ГОРОДА И ЖИЛЬЁ</text><text x="161" y="528" fill="#b2c4df" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="450" text-anchor="start" opacity="1">Материалы  →  Реновация  →  Комфорт  →  Человеческий капитал</text><rect x="58" y="555" width="1380" height="73" rx="18" fill="#101d34" stroke="#27405f" opacity="1"/><rect x="58" y="555" width="82" height="73" rx="12" fill="#142640" stroke="#27405f" opacity="1"/><text x="100" y="602" fill="#52bdff" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="800" text-anchor="middle" opacity="1">06</text><text x="161" y="586" fill="#f1f6fd" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" opacity="1">ЭКСПОРТ И ЛОГИСТИКА</text><text x="161" y="613" fill="#b2c4df" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="450" text-anchor="start" opacity="1">Предприятия  →  Коридоры  →  Платежи  →  Внешний спрос</text><rect x="58" y="640" width="1380" height="73" rx="18" fill="#101d34" stroke="#27405f" opacity="1"/><rect x="58" y="640" width="82" height="73" rx="12" fill="#142640" stroke="#27405f" opacity="1"/><text x="100" y="687" fill="#37e5c0" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="800" text-anchor="middle" opacity="1">07</text><text x="161" y="671" fill="#f1f6fd" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" opacity="1">НАУКА И IP</text><text x="161" y="698" fill="#b2c4df" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="450" text-anchor="start" opacity="1">Исследование  →  Доказательства  →  Пилот  →  Продукт  →  Рынок</text></svg>